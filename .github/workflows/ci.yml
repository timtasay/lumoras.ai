# CI for the pnpm workspace: lumoras.ai (apps/web), Lumoras Growth (apps/seo) and
# the shared packages (packages/*). Runs on pushes and pull requests to dev and main.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, unit + integration tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # throwaway PostgreSQL 16: migrations runner, RLS isolation (incl. the Phase 2 and Phase 3 tables), Better Auth,
      # seed and audit tests, the metered call path (cache, budget and reserve, concurrency), Google connections,
      # Phase 3: the content pipeline (FakeLlm, fake GitHub, signed webhooks), the pg-boss worker process end to end
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the integration tests create databases with deploy/postgres/10-seo-database.sh, which uses psql
      - run: psql --version
      - run: pnpm typecheck
      - run: pnpm lint
      # unit + integration (the integration suites fail loudly here rather than skip: TEST_DATABASE_URL is set).
      # Providers, Google, the model (FakeLlm), GitHub/Gitea and webhook receivers are always local fakes:
      # no test reaches DataForSEO, OpenSEO, Google, Anthropic or GitHub, and no secret is needed.
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # e2e/serve.ts creates a fresh database here, seeds it and runs the production build against it
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the browser matching the pinned @playwright/test
      - run: pnpm --filter seo exec playwright install --with-deps chromium
      - run: pnpm build
      - run: mkdir -p "$SCREENSHOT_DIR"
      # apps/seo: sign-in via captured magic link, onboarding against a fake site, invitations,
      # viewer limits, impersonation in the audit log, every screen in both themes at 375 and 1440,
      # reduced motion, /design; Phase 2: research with the cost confirm (fake provider), budget
      # refusal, Budget and usage + CSV, Search Console / GA4 OAuth against a fake Google;
      # Phase 3 (the worker runs too): review gate by role, editor lint/diff, calendar drag + keyboard,
      # live run view, runway banner, publishing connector Test, onboarding steps 7-8;
      # apps/web: homepage smoke
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-screenshots
          path: screenshots
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/*/test-results
            apps/*/playwright-report
          retention-days: 7
